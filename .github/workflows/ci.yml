# CH-3: the same gates used locally, on every push and pull request.
# Status: first GitHub run failed on ubuntu-latest (26.04, unsupported by Playwright); runner pinned to 24.04.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    # Pinned: Playwright 1.56 does not support the newer ubuntu-latest image (26.04).
    # Bump this together with @playwright/test, not independently.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x" # node:sqlite needs >= 22.13
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run scan:secrets
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
